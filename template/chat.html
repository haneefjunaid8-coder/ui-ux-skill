<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Chat with Courier</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="chat">
<div class="app">
  <header class="chathead">
    <button class="round" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="avatar"></span>
    <div class="who"><strong>Khalid Omor</strong><small>Courier — Diriyah → Jeddah</small><em><i></i>Active Now</em></div>
    <button class="round" id="callTop" aria-label="Call"><svg viewBox="0 0 24 24"><path d="M6 3h3l2 5-2 1.5a11 11 0 006 6L16.5 13l5 2v3a3 3 0 01-3 3A16 16 0 013 6a3 3 0 013-3z"/></svg></button>
    <button class="round" id="videoTop" aria-label="Video call"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></svg></button>
  </header>

  <div class="msgs" id="msgs"></div>

  <div class="chips" id="chips">
    <button>Share live location</button><button>Call Courier</button><button>Delivery Time Update</button>
  </div>

  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="plus" data-soon="Attachments" aria-label="Attach">+</button>
    <input id="chatInput" placeholder="Type your message..." enterkeyhint="send">
    <svg class="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
    <button class="send" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg></button>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
